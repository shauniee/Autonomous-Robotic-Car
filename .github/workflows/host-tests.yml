name: Checks

# What runs without the car. A pass here does not claim a Pico run or physical
# acceptance; subsystem results that need the car stay NEEDS EVIDENCE.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  coding-standard:
    name: BARR-C:2018 coding standard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every line of app_program must comply
        run: python3 scripts/check_barr.py --all

  secrets:
    name: No secrets in new commits (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1
        run: >
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          | tar xz -C "$RUNNER_TEMP" gitleaks
      # Only the new commits: older history is not rescanned on every run.
      - name: Scan the pull request's commits
        if: github.event_name == 'pull_request'
        run: >
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner
          --log-opts="origin/${{ github.base_ref }}..HEAD"
      - name: Scan the pushed commit
        if: github.event_name == 'push'
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="-1"'

  deliverables:
    name: Subsystem deliverables and alignment
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_deliverables.py

  host-tests:
    name: C/Python/MQTT host tests and dashboard checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Host test suite (C and Python)
        run: bash testing/host/run.sh
      - name: Dashboard regression checks (Node)
        run: node testing/host/test_dashboard.mjs

  firmware-build:
    name: Firmware builds for every profile
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the Arm compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Fetch Pico SDK 2.2.0
        run: >
          git clone --depth 1 --branch 2.2.0 --recurse-submodules
          --shallow-submodules https://github.com/raspberrypi/pico-sdk.git
          "$RUNNER_TEMP/pico-sdk"
      - name: Use the example network settings
        run: cp config/wifi_secrets.example.h config/wifi_secrets.h
      - name: Build all profiles, never flashes
        env:
          JOBS: 4
        run: PICO_SDK_PATH="$RUNNER_TEMP/pico-sdk" sh testing/build_pending_profiles.sh
