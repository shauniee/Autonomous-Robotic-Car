name: Task or feature
description: Work to do, a test to run or a change to make
title: "feat(<scope>): "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or in the way? Name the requirement (M, FR, NFR, CIR) if there is one.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Include what "done" means, e.g. the test ID that must pass.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
