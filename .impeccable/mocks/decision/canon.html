<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;overflow:hidden;background:#f6f7f9;color:#111827;font:15px/1.4 system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 28px}h1{font-size:20px}.pill{display:inline-block;margin-left:8px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;background:#dcfce7;color:#15803d}
main{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:0 28px}.c{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px}.l{font-size:12px;color:#6b7280;text-transform:uppercase;letter-spacing:.05em}.b{font-size:28px;font-weight:700;margin-top:4px}.s{font-size:13px;color:#6b7280}
.bad{color:#b91c1c}.m{grid-column:span 2}.m .r{display:flex;gap:10px;margin-top:10px}.m input{width:64px;height:52px;border:1px solid #d1d5db;border-radius:8px;font:700 26px system-ui;text-align:center}.m button{height:52px;padding:0 20px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-weight:600}
.w{grid-column:1/-1}
</style></head><body>
<header><h1>Robot Telemetry</h1><div><span class="pill">Connected</span><span class="pill">Robot online</span><span class="pill">Live</span></div></header>
<main>
<div class="c"><div class="l">Mission</div><div class="b bad">STOPPED</div><div class="s">Frame #4127</div></div>
<div class="c m"><div class="l">Barcode mapping</div><div class="r"><input value="A"><input value="B"><input value="C"><input value="D"><button>Send</button></div><div class="s" style="margin-top:6px">Left · Right · Straight · U-turn — ACK seq 7 OK</div></div>
<div class="c"><div class="l">Active faults</div><div class="b bad" style="font-size:18px">Mission: line lost</div></div>
<div class="c"><div class="l">Line</div><div class="b">LOST</div></div><div class="c"><div class="l">Motion</div><div class="b">IDLE</div></div><div class="c"><div class="l">Obstacle</div><div class="b">312 mm</div></div><div class="c"><div class="l">Terrain</div><div class="b">3 humps</div></div>
<div class="c w"><div class="l">Wheel speed</div><svg width="1330" height="160"><polyline fill="none" stroke="#2563eb" stroke-width="2" points="0,80 120,40 700,44 900,80 1330,80"/><polyline fill="none" stroke="#db2777" stroke-width="2" points="0,80 120,44 700,40 900,80 1330,80"/></svg></div>
</main></body></html>
