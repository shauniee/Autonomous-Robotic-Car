# Run from the repository root. Private, trusted bench network only.
# This lab listener permits unauthenticated access and has no TLS.
# Lines beginning with # are explanations; Mosquitto ignores them.
# This file configures the broker on your LAPTOP, not the Pico firmware.

# Accept MQTT connections on TCP port 1883.
# 0.0.0.0 means listen on all laptop IPv4 interfaces, allowing the Pico to reach it.
# It is a listening address: put the laptop's real LAN IP in wifi_secrets.h.
listener 1883 0.0.0.0

# Let clients connect without a broker username/password on the trusted lab LAN.
# The current Pico telemetry client connects without broker credentials.
# This does not remove the WiFi password needed to join your WiFi network.
allow_anonymous true

# Do not save broker state/messages to disk across broker restarts.
# Retained messages can still be held in memory while the broker is running.
persistence false
